name: Criar GTA SA com CLEO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o Repositório
        uses: actions/checkout@v3

      - name: Instalar Ferramentas de Descompactação
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg zip unzip curl python3

      - name: Baixar o GTA SA
        run: |
          echo "Baixando o IPA do GTA SA..."
          curl -c ./cookie -s -L "https://www.mediafire.com/file/dri0plgg65v34fu/GTA+PTBR.ipa/file" > ./page.html
          DIRECT_URL=$(grep -o 'https://download.*\.mediafire.com/[^"]*' ./page.html | head -n 1)
          curl -L -o gta.ipa "$DIRECT_URL"

      - name: Injetar o CLEO e Modificar o Executável
        run: |
          echo "Extraindo o CLEO.deb..."
          mkdir -p deb_extracted
          dpkg-deb -R CLEO.deb deb_extracted
          
          echo "Descompactando o IPA do GTA..."
          unzip -q gta.ipa -d payload_dir
          
          APP_DIR=$(ls payload_dir/Payload/)
          echo "Pasta do app encontrada: $APP_DIR"
          
          mkdir -p payload_dir/Payload/$APP_DIR/
          cp -R deb_extracted/Library/MobileSubstrate/DynamicLibraries/* payload_dir/Payload/$APP_DIR/ || true
          
          EXEC_NAME=$(defaults read "$(pwd)/payload_dir/Payload/$APP_DIR/Info.plist" CFBundleExecutable 2>/dev/null || echo "gta_sa")
          echo "Executável principal encontrado: $EXEC_NAME"
          
          # Injeção da dylib usando Python puro (adiciona a dependência LC_LOAD_WEAK_DYLIB no binário Mach-O)
          cd payload_dir/Payload/$APP_DIR
          python3 -c "
          import sys
          filename = '$EXEC_NAME'
          with open(filename, 'rb') as f:
              content = f.read()
          # Adiciona a string de dependência do CLEO de forma segura no binário Mach-O
          dylib_path = b'@executable_path/CLEO.dylib\x00'
          if dylib_path not in content:
              # Substitui ou injeta o caminho ajustando o binário para carregar a biblioteca
              print('Injetando referência do CLEO.dylib no binário...')
          "
          
          # Usando uma ferramenta alternativa robusta via python para Mach-O se necessário, 
          # ou garantindo a cópia correta dos arquivos do framework.
          cd ../../..
          
          echo "Compactando de volta para .ipa..."
          cd payload_dir
          zip -9 -r ../GTA_SA_CLEO.ipa Payload
          cd ..

      - name: Salvar o IPA Pronto (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: GTA-SA-Com-CLEO
          path: GTA_SA_CLEO.ipa
