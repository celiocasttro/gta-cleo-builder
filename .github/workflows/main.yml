name: Criar GTA SA com CLEO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o Repositório
        uses: actions/checkout@v3

      - name: Instalar Ferramentas de Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg zip unzip curl build-essential git

      - name: Compilar o Injetor de Dylib
        run: |
          git clone https://github.com/DHowett/insert_dylib.git
          cd insert_dylib
          make
          sudo cp insert_dylib /usr/local/bin/
          cd ..

      - name: Baixar o GTA SA
        run: |
          echo "Baixando o IPA do GTA SA..."
          curl -c ./cookie -s -L "https://www.mediafire.com/file/dri0plgg65v34fu/GTA+PTBR.ipa/file" > ./page.html
          DIRECT_URL=$(grep -o 'https://download.*\.mediafire.com/[^"]*' ./page.html | head -n 1)
          curl -L -o gta.ipa "$DIRECT_URL"

      - name: Extrair e Injetar o CLEO igual ao Dpkg
        run: |
          echo "Extraindo o CLEO.deb..."
          mkdir -p deb_extracted
          dpkg-deb -R CLEO.deb deb_extracted
          
          echo "Descompactando o IPA do GTA..."
          unzip -q gta.ipa -d payload_dir
          
          APP_DIR=$(ls payload_dir/Payload/)
          echo "Pasta do app encontrada: $APP_DIR"
          
          # Copia os arquivos extraídos do .deb exatamente para a raiz do .app (mesmo local do executável)
          mkdir -p payload_dir/Payload/$APP_DIR/
          cp -R deb_extracted/Library/MobileSubstrate/DynamicLibraries/* payload_dir/Payload/$APP_DIR/ || true
          
          # Entra na pasta do app e aplica a injeção binária no executável 'gtasa'
          cd payload_dir/Payload/$APP_DIR
          
          if [ -f "gtasa" ]; then
            echo "Injetando CLEO.dylib no executável gtasa..."
            insert_dylib --inplace --weak "@executable_path/CLEO.dylib" gtasa
          else
            echo "Aviso: Executável gtasa não encontrado diretamente, procurando..."
            EXEC_FILE=$(ls -p | grep -v / | head -n 1)
            insert_dylib --inplace --weak "@executable_path/CLEO.dylib" "$EXEC_FILE"
          fi
          
          cd ../../..
          
          echo "Compactando de volta para .ipa..."
          cd payload_dir
          zip -9 -r ../GTA_SA_CLEO.ipa Payload
          cd ..

      - name: Salvar o IPA Pronto (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: GTA-SA-Com-CLEO
          path: GTA_SA_CLEO.ipa
