Name: Criar GTA SA com CLEO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o Repositório
        uses: actions/checkout@v3

      - name: Instalar Ferramentas de Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg zip unzip curl python3

      - name: Baixar o GTA SA
        run: |
          echo "Baixando o IPA do GTA SA..."
          curl -c ./cookie -s -L "https://www.mediafire.com/file/fkjuog2c2v6ovns/GTASA-MOD_V.ipa/file" > ./page.html
          DIRECT_URL=$(grep -o 'https://download.*\.mediafire.com/[^"]*' ./page.html | head -n 1)
          curl -L -o gta.ipa "$DIRECT_URL"

      - name: Extrair, Remover Propagandas, Ajustar Frameworks e Injetar
        run: |
          echo "Extraindo o CLEO.deb..."
          mkdir -p deb_extracted
          dpkg-deb -R CLEO.deb deb_extracted
          
          echo "Descompactando o IPA do GTA..."
          unzip -q gta.ipa -d payload_dir
          
          APP_DIR=$(ls payload_dir/Payload/)
          echo "Pasta do app encontrada: $APP_DIR"
          
          # ==========================================
          # REMOÇÃO DE PROPAGANDAS E ARQUIVOS INDESEJADOS
          # ==========================================
          echo "Removendo resquícios de anúncios e telas de introdução da IPAOMTK..."
          # Remove arquivos HTML, imagens de splash de terceiros ou scripts órfãos se existirem na raiz do app
          find payload_dir/Payload/$APP_DIR -maxdepth 2 -type f \( -name "*.html" -o -name "*ipao*" -o -name "*omtk*" \) -delete || true
          
          # Cria a estrutura de Frameworks dentro do app
          mkdir -p payload_dir/Payload/$APP_DIR/Frameworks
          
          # Copia a dylib e o plist para a pasta Frameworks
          cp deb_extracted/Library/MobileSubstrate/DynamicLibraries/CLEO.dylib payload_dir/Payload/$APP_DIR/Frameworks/
          cp deb_extracted/Library/MobileSubstrate/DynamicLibraries/CLEO.plist payload_dir/Payload/$APP_DIR/Frameworks/ || true
          
          # Entra na pasta do app e executa o script de injeção e ajuste do plist
          cd payload_dir/Payload/$APP_DIR
          
          python3 -c '
          import os
          import plistlib

          # 1. Atualiza o CLEO.plist para aceitar o binário correto e o caminho da Framework
          cleo_plist_path = "Frameworks/CLEO.plist"
          if os.path.exists(cleo_plist_path):
              try:
                  with open(cleo_plist_path, "rb") as fp:
                      plist_data = plistlib.load(fp)
              except:
                  plist_data = {}

              if not isinstance(plist_data, dict):
                  plist_data = {}

              if "Executables" not in plist_data:
                  plist_data["Executables"] = ["gta3sa", "gtasager", "gtasa"]
              
              for target_exec in ["gta3sa", "gtasa"]:
                  if target_exec not in plist_data["Executables"]:
                      plist_data["Executables"].append(target_exec)
              
              with open(cleo_plist_path, "wb") as fp:
                  plistlib.dump(plist_data, fp, fmt=plistlib.FMT_XML)
              print("CLEO.plist atualizado com sucesso!")

          # 2. Injeta a referência apontando para o Frameworks no binário executável
          exec_name = "gta3sa"
          if not os.path.exists(exec_name):
              for f in os.listdir("."):
                  if os.path.isfile(f) and "." not in f and f != "Info.plist":
                      exec_name = f
                      break

          print(f"Injetando dependência do CLEO.dylib no binário: {exec_name}")
          with open(exec_name, "rb") as f:
              data = bytearray(f.read())

          dylib_path = b"@executable_path/Frameworks/CLEO.dylib\x00"
          if dylib_path not in data:
              while len(dylib_path) % 4 != 0:
                  dylib_path += b"\x00"
              data.extend(dylib_path)
              with open(exec_name, "wb") as f:
                  f.write(data)
              print("Referência injetada com sucesso para a pasta Frameworks!")
          else:
              print("A referência da dylib já estava presente.")
          '
          
          cd ../../..
          
          echo "Compactando de volta para .ipa..."
          cd payload_dir
          zip -9 -r ../GTA_SA_CLEO.ipa Payload
          cd ..

      - name: Salvar o IPA Pronto (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: GTA-SA-Com-CLEO
          path: GTA_SA_CLEO.ipa
