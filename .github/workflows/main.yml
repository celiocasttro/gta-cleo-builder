name: Baixar Arquivo Pesado

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'Cole o link direto do arquivo aqui'
        required: true
        type: string

jobs:
  download-file:
    runs-on: ubuntu-latest
    steps:
      - name: Baixando arquivo com cURL
        run: |
          # O comando abaixo baixa o arquivo mantendo o nome original
          curl -L -O "${{ inputs.file_url }}"

      - name: Salvando o arquivo como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: arquivo-baixado
          path: ./* # Salva qualquer arquivo gerado/baixado no diretório atual
